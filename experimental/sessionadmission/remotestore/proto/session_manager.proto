syntax = "proto3";

// Package xnet.sessionmanager.v1 is the FINALIZED v1 wire contract for the
// X-NET Central Session Manager.
//
// This .proto is the single source of truth shared by BOTH sides:
//   - the manager server (this module, github.com/xpanel-cp/xnet-session-manager)
//   - the sing-box node client (the RemoteStore adapter in the sing-box fork).
//
// Because the two live in separate Go modules / repos, the generated Go stubs
// are produced here (via `buf generate`) and regenerated byte-identically into
// the fork from THIS file. The file must stay locked; changes are regenerated
// on both sides together.
//
// v1 ships UNARY RPCs ONLY. Field numbers are kept stable and reserved for
// evolution, and the two planned server-streaming RPCs are declared as
// comments/reservations so they can be added later with NO breaking change to
// the unary contract.
//
// Transport / security note: mTLS is a pure transport-layer concern (gRPC
// channel credentials); enabling it later requires NO change to any message or
// RPC here. HMAC-SHA256 per-node auth is carried in call metadata
// (node_id / timestamp / nonce / signature), not in these messages.
//
// ---------------------------------------------------------------------------
// FORK COPY NOTE (sing-box RemoteStore, Phase 3 / Task 10):
// The package name, messages, fields, field numbers, and service/RPC
// definitions below are BYTE-IDENTICAL to the manager's canonical copy at
//   f:\xnet\session-manager\proto\sessionmanagerv1\session_manager.proto
// so the two modules stay WIRE-COMPATIBLE. The ONLY intentional divergence is
// the `option go_package` line: it points into THIS module
// (github.com/sagernet/sing-box) instead of the manager module, because the
// fork is a separate Go module and cannot share the manager's import path. A
// different Go import path does NOT affect wire compatibility. When the
// contract changes, regenerate BOTH sides from the same definitions.
// ---------------------------------------------------------------------------
package xnet.sessionmanager.v1;

option go_package = "github.com/sagernet/sing-box/experimental/sessionadmission/remotestore/managerpb;managerpb";

// SessionManager is the central authority for per-user device and concurrent-
// session limits enforced globally across every X-NET node.
service SessionManager {
  // --- v1 UNARY contract (FINALIZED) ---

  // AcquireSession evaluates both caps atomically for the user and admits or
  // rejects one connection. This is the hot admission path (gRPC only).
  rpc AcquireSession    (AcquireSessionRequest)     returns (AcquireSessionResponse);

  // ReleaseSession frees the slot held by a lease. Idempotent.
  rpc ReleaseSession    (ReleaseSessionRequest)     returns (ReleaseSessionResponse);

  // RenewLease renews a batch of leases (node heartbeat / keepalive) and
  // reports which are still valid and which have expired.
  rpc RenewLease        (RenewLeaseRequest)         returns (RenewLeaseResponse);

  // GetSessionSnapshot returns the live device/session view for a user
  // (observability / admin read).
  rpc GetSessionSnapshot(GetSessionSnapshotRequest) returns (GetSessionSnapshotResponse);

  // RevokeSession is an ADMIN/future control operation. Node RPC credentials
  // cannot revoke; the manager denies node callers (PermissionDenied) in v1.
  rpc RevokeSession     (RevokeSessionRequest)      returns (RevokeSessionResponse);

  // NodeHeartbeat is an OPTIONAL, strictly ADDITIVE liveness signal by which an
  // IDLE node holding zero leases refreshes its last_heartbeat in the manager's
  // NodeRegistry (Requirement 17.3). A node holding leases refreshes its
  // liveness implicitly through RenewLease, so this RPC is only needed while a
  // node has no live leases to renew. It is a NODE-role data-plane op,
  // authenticated exactly like the other node RPCs (HMAC in call metadata).
  rpc NodeHeartbeat     (NodeHeartbeatRequest)      returns (NodeHeartbeatResponse);

  // --- RESERVED / PLANNED future SERVER STREAMING (NOT in v1) ---
  // Declared/reserved so they can be added later with NO breaking change to the
  // unary contract above. v1 does NOT implement these.
  //
  // rpc WatchRevocations (WatchRevocationsRequest) returns (stream RevocationEvent); // manager->node revoke notifications
  // rpc HeartbeatStream  (stream HeartbeatFrame)   returns (stream HeartbeatAck);    // node heartbeat stream
}

// AcquireSessionRequest carries both caps; each is independently disableable
// (0/absent disables that cap). device_key is OPAQUE (node-composed); the
// manager keys on it verbatim.
message AcquireSessionRequest {
  string user        = 1;
  string device_key  = 2;   // OPAQUE (node-composed); manager keys on it verbatim
  int32  max_devices  = 3;  // 0/absent disables the device cap
  int32  max_sessions = 4;  // 0/absent disables the session cap
  string node_id     = 5;
  string conn_id     = 6;   // unique per-connection; idempotency key
  reserved 7 to 15;         // keep field numbers stable/reserved for evolution
}

message AcquireSessionResponse {
  bool   admitted = 1;
  string reason   = 2;      // DEVICE_LIMIT_REACHED / SESSION_LIMIT_REACHED / ...
  string lease_id = 3;
  int64  ttl      = 4;      // lease TTL in milliseconds
  reserved 5 to 15;
}

// ReleaseSessionRequest frees the slot for lease_id. Idempotent; releasing an
// unknown/expired lease is a no-op success.
message ReleaseSessionRequest {
  string lease_id = 1;
  string node_id  = 2;      // owning node (authorization: own-lease rule)
  reserved 3 to 15;
}

message ReleaseSessionResponse {
  bool released = 1;        // true if a slot was freed; false if already gone
  reserved 2 to 15;
}

// RenewLeaseRequest renews a batch of leases in one call (heartbeat).
message RenewLeaseRequest {
  repeated string lease_id = 1;
  string node_id           = 2; // owning node (authorization: own-lease rule)
  reserved 3 to 15;
}

message RenewLeaseResponse {
  repeated string valid   = 1;  // leases still valid (extended)
  repeated string expired = 2;  // leases that were unknown/already expired
  reserved 3 to 15;
}

// GetSessionSnapshotRequest asks for the live device/session view of a user.
message GetSessionSnapshotRequest {
  string user = 1;
  reserved 2 to 15;
}

message GetSessionSnapshotResponse {
  string          user     = 1;
  repeated Device devices  = 2;
  int32           sessions = 3; // total live sessions across devices
  reserved 4 to 15;
}

// Device is an observability projection of one device slot.
message Device {
  string device_key   = 1;
  string ip           = 2;
  int32  connections  = 3;  // live connections attached to this device slot
  int64  first_seen   = 4;  // unix millis
  int64  last_active  = 5;  // unix millis
  reserved 6 to 15;
}

// RevokeSessionRequest is the admin/future control path. device_key is optional
// (empty = revoke all of the user's sessions).
message RevokeSessionRequest {
  string user       = 1;
  string device_key = 2;    // optional; empty revokes all of the user's sessions
  reserved 3 to 15;
}

message RevokeSessionResponse {
  bool  revoked = 1;
  int32 freed   = 2;        // number of slots freed
  reserved 3 to 15;
}

// NodeHeartbeatRequest is the optional idle-node liveness signal. The
// authenticated node identity (carried in call metadata) is authoritative; the
// node_id field mirrors the other node RPCs and must match the caller.
message NodeHeartbeatRequest {
  string node_id = 1;
  reserved 2 to 15;         // keep field numbers stable/reserved for evolution
}

message NodeHeartbeatResponse {
  reserved 1 to 15;         // no v1 payload; reserved for additive evolution
}
